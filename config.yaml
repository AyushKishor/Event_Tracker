  coffee, brunch, "office hours", "touch grass", "demo night", hackathon, devfest, "bob tv", "w/", "x", community, student, university, reactor, "SBG", "chapter"]

# Discovery searches (needs TAVILY_API_KEY - free 1,000 searches/month - or BRAVE_API_KEY). {company}/{city}/{year} are filled in; from July on next year is
# searched too. Hits are scraped and pass the same region / relevance / small-event rules as everything else.
discovery:
  enabled: true
  results_per_query: 8
  companies: [Microsoft, AWS, Google Cloud, Salesforce, ServiceNow, Oracle]  # keeps search volume low
  queries:
    - "{company} partner summit {year}"
    - "{company} channel partner event {year}"
    - "{company} partner ecosystem conference {year} speaker"
  # Main event cities (named regions + the big US conference cities): catches third-party events the company pages never list.
  cities: [New York, Seattle, Bellevue, San Francisco, San Jose, Austin, Dallas, Las Vegas, Chicago, Atlanta,
    Bengaluru, Mumbai, Hyderabad]
  city_queries:
    - "partner summit {city} {year}"
    - "channel partner event {city} {year}"
    - "alliances ecosystem conference {city} {year}"
  exclude_domains: [linkedin.com, facebook.com, instagram.com, x.com, twitter.com, youtube.com, reddit.com,
    wikipedia.org, glassdoor.com, indeed.com]
