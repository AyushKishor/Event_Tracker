# Words that mark an event as channel/partner relevant (used for Discovery
# and for sources with require_company/require_keyword set).
keywords:
  - channel
  - partner
  - alliance
  - alliances
  - co-sell
  - marketplace
  - ISV
  - GSI
  - reseller
  - MSP
  - ecosystem
  - partnership
  - partnerships
  - alliances
  - "channel partners"
  - "partner summit"
  - "partner forum"
  - "partner day"
  - "seller forum"
  - "customer edge"

# Cities recognised next to flagship-event dates on vendor pages (anything in `regions` also works).
known_cities: [Las Vegas, Orlando, Chicago, Boston, "Washington, D.C.", Washington, Atlanta, Denver, Phoenix, Miami,
  Nashville, San Diego, New Orleans, Philadelphia, Toronto, Vancouver, Montreal, Mexico City, London, Paris, Berlin, Munich,
  Amsterdam, Barcelona, Madrid, Milan, Dublin, Stockholm, Copenhagen, Dubai, Riyadh, Tel Aviv, Singapore, Sydney, Melbourne,
  Tokyo, Osaka, Seoul, Taipei, Jakarta, Mumbai, Bengaluru, Hyderabad, Delhi, Pune, Chennai, San Francisco, San Jose,
  Santa Clara, Austin, Dallas, Houston, San Antonio, Seattle, New York, Bellevue, Redmond, Anaheim, Moscone, Venetian]

# Channel / partnership-industry events that are always relevant (name match).
channel_events:
  - "Channel Partners"
  - "MSP Summit"
  - "Catalyst by Partnership Leaders"
  - "PartnerTechX"
  - "Xchange"
  - "Channel Pro"
  - "Channel Futures"
  - "Channel Focus"
  - "CRN"
  - "Partnership Leaders"
  - "Crossbeam"

# General tech events to always track by name (kept even outside priority regions).
always_track:
  - "CES"
  - "NRF Big Show"
  - "TechCrunch Disrupt"
  - "SaaStr"
  - "AI4"
  - "Human X"
  - "Dubai AI Festival"
  - "AI Impact Summit"
  - "Cypher"
  - "Seattle AI Week"
  - "Cloud Summit"
  - "GTC"
  - "Dreamforce"
  - "re:Invent"
  - "Google Cloud Next"
  - "Knowledge 20*"
  - "Ignite"
  - "AI World"
  - "AI Tour"
  - "World Forum"
  - "Accelerate"
  - "TechCon 365"
  - "TechMentor"
  - "SecureWorld"
  - "CIO Community"
  - "Evanta"
  - "Data Community Summit"

# Generic tech events: kept when in a priority region and the name has an event word or a topic word
# (catches local meetups/summits like "AI Agents Seattle", "ElevateIT Seattle Technology Summit").
event_words: [summit, leadership, investor, marketing, enablement, social, conference, expo, forum, meetup, symposium, hackathon, hack, social, tour, week, congress, "demo night", conclave]
topic_words: [AI, agent, agents, agentic, cloud, data, cyber, cybersecurity, security, SaaS, tech, technology, "zero trust", gemini, quantum, enterprise, CIO, CISO, IT]

# Discovery searches (needs BRAVE_API_KEY). {company} is substituted per company.
discovery:
  enabled: true
  results_per_query: 10
  companies: [Microsoft, AWS, Google Cloud, Salesforce, ServiceNow, Oracle]  # keeps search volume low
  queries:
    - "{company} partner summit {year}"
    - "{company} channel partner event {year}"
    - "{company} partner ecosystem conference {year} speaker"
