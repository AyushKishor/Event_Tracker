  - "Channel Leader Summit"
  - "Channel Marketing Association"
  - "CMA"
  - "Channel Chiefs"
  - "Best of Breed"
  - "NexGen"
  - "XChange"

# General tech events to always track by name (kept even outside priority regions).
always_track:
  - "CES"
  - "NRF Big Show"
  - "TechCrunch Disrupt"
  - "SaaStr"
  - "AI4"
  - "Human X"
  - "Dubai AI Festival"
  - "AI Impact Summit"
  - "Cypher"
  - "Seattle AI Week"
  - "Cloud Summit"
  - "GTC"
  - "Dreamforce"
  - "re:Invent"
  - "Google Cloud Next"
  - "Knowledge 20*"
  - "Ignite"
  - "AI World"
  - "AI Tour"
  - "World Forum"
  - "Accelerate"
  - "TechCon 365"
  - "TechMentor"
  - "SecureWorld"
  - "CIO Community"
  - "Evanta"
  - "Data Community Summit"

# Small community events are skipped (unless the name is an always_track / channel_events name).
skip_words: [meetup, "user group", "happy hour", mixer, networking, cocktail, "study group", "study jam", "hack night",
  coffee, brunch, "office hours", "touch grass", "demo night", hackathon, devfest, "bob tv", "w/", community, student, university, reactor, "SBG", "chapter"]

# Discovery searches (needs BRAVE_API_KEY). {company} is substituted per company.
discovery:
  enabled: true
  results_per_query: 10
  companies: [Microsoft, AWS, Google Cloud, Salesforce, ServiceNow, Oracle]  # keeps search volume low
  queries:
    - "{company} partner summit {year}"
    - "{company} channel partner event {year}"
    - "{company} partner ecosystem conference {year} speaker"
