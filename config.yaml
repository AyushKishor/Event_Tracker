# Words that mark an event as channel/partner relevant (used for Discovery
# and for sources with require_company/require_keyword set).
keywords:
  - channel
  - partner
  - alliance
  - alliances
  - co-sell
  - marketplace
  - ISV
  - GSI
  - reseller
  - MSP
  - ecosystem
  - partnership
  - partnerships
  - alliances
  - "channel partners"
  - "partner summit"
  - "partner forum"
  - "partner day"
  - "seller forum"
  - "customer edge"

# Cities recognised next to flagship-event dates on vendor pages (anything in `regions` also works).
known_cities: [Las Vegas, Orlando, Chicago, Boston, "Washington, D.C.", Washington, Atlanta, Denver, Phoenix, Miami,
  Nashville, San Diego, New Orleans, Philadelphia, Toronto, Vancouver, Montreal, Mexico City, London, Paris, Berlin, Munich,
  Amsterdam, Barcelona, Madrid, Milan, Dublin, Stockholm, Copenhagen, Dubai, Riyadh, Tel Aviv, Singapore, Sydney, Melbourne,
  Tokyo, Osaka, Seoul, Taipei, Jakarta, Mumbai, Bengaluru, Hyderabad, Delhi, Pune, Chennai, San Francisco, San Jose,
  Santa Clara, Austin, Dallas, Houston, San Antonio, Seattle, New York, Bellevue, Redmond, Anaheim, Moscone, Venetian]

# Events that borrow a flagship's city when their own page gives none ("Catalyst Breakfast at Microsoft Ignite").
event_cities: {"Microsoft Ignite": San Francisco, "re:Invent": Las Vegas, "Dreamforce": San Francisco,
  "Google Cloud Next": Las Vegas, "Oracle AI World": Las Vegas, "Knowledge 20": Las Vegas, "Cisco Live": Las Vegas}

# Channel / partnership-industry events that are always relevant (name match).
channel_events:
  - "Channel Partners"
  - "MSP Summit"
  - "Catalyst by Partnership Leaders"
  - "PartnerTechX"
  - "Xchange"
  - "Channel Pro"
  - "ChannelPro"
