# Watchlist: the finite set of pages scraped on every run.
# Add a page here once Discovery (or you) find a good one.
#
# name: force the event name (flagship pages whose headings are marketing copy)
# single: one-event page; keep only the nearest upcoming date
# trusted: channel-industry publisher/association; every listed event counts (still region + small-event filters)
# require_company: only keep events that mention one of the tracked companies
# require_keyword: only keep events that mention a channel/partner keyword
# host: default Organiser/Host when the page does not state one
# Named flagships (name + single) whose page shows no date are looked up by web search; if still nothing, they
# stay in the sheet as 'Date TBD' until a later run finds the date.
# name_prefix: put in front of event names that do not already say who runs them ("World Tour NYC" -> "Salesforce World Tour NYC")
#
# Company pages keep every event the company runs (no keyword needed), except Google Cloud, Oracle and SAP:
# their pages are mostly webinars / other vendors' events, so they keep require_keyword.

sources:
